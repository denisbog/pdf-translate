[package]
name = "pdf-translate"
version = "0.1.0"
edition = "2021"
# The renderer is PdfCraft v0.5.0, whose workspace is rust-version 1.90.
rust-version = "1.90"
description = "Read PDFs with paragraph translations from a local model, rendered inside the document"
publish = false

[dependencies]
pdfcraft-render = { git = "https://github.com/storytold/pdfcraft", tag = "v0.5.0", package = "pdfcraft-render" }
egui = "0.36"
# `epaint` is egui's own paint/text crate: only `text::VariationCoords` is used here, to pick
# a `wght` instance of the variable UI fonts.
epaint = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland", "links"] }
rfd = "0.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "cuda", "api-17"] }
tokenizers = "0.23.2"
ureq = { version = "3.4.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9.0"
libc = "0.2"
# Assets, from crates rather than from a PdfCraft checkout: the official Lucide SVG icons
# (ISC) and the Inter / JetBrains Mono variable faces (OFL).
lucide-static-svg = "1.54"
damascene-fonts-inter = "0.1"
damascene-fonts-jetbrains-mono = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

# The renderer is PdfCraft's, taken from its repository at the v0.5.0 tag: `pdfcraft-render`
# is a crate of that workspace, and the crates below are the forked hayro/lopdf it is built
# against (from the repository's `vendor/`, which keeps PdfCraft's fixes: render_into,
# ocg_overrides, hide_comments, cancellation and the fuzz hardening). Pinning a tag keeps
# the build reproducible; bump it when PdfCraft tags a new release.
[patch.crates-io]
hayro-interpret = { git = "https://github.com/storytold/pdfcraft", tag = "v0.5.0", package = "hayro-interpret" }
hayro = { git = "https://github.com/storytold/pdfcraft", tag = "v0.5.0", package = "hayro" }
hayro-syntax = { git = "https://github.com/storytold/pdfcraft", tag = "v0.5.0", package = "hayro-syntax" }
hayro-jbig2 = { git = "https://github.com/storytold/pdfcraft", tag = "v0.5.0", package = "hayro-jbig2" }
lopdf = { git = "https://github.com/storytold/pdfcraft", tag = "v0.5.0", package = "lopdf" }

[package]
name = "pdf-translate"
version = "0.1.0"
edition = "2021"
# The renderer is the `hayro` crate (hayro-interpret + vello_cpu), whose rust-version is 1.92.
rust-version = "1.92"
description = "Read PDFs with paragraph translations from a local model, rendered inside the document"
publish = false

[dependencies]
# The page rasterizer and text interpreter, used directly (no PdfCraft wrapper).
hayro = "0.7.1"
# The geometry types hayro's `Device` trait uses, for text extraction.
kurbo = "0.13"
egui = "0.36"
# `epaint` is egui's own paint/text crate: only `text::VariationCoords` is used here, to pick
# a `wght` instance of the variable UI fonts.
epaint = { version = "0.36", default-features = false }
egui_extras = { version = "0.36", default-features = false, features = ["svg"] }
eframe = { version = "0.36", default-features = false, features = ["default_fonts", "glow", "persistence", "accesskit", "x11", "wayland", "links"] }
rfd = "0.17"
ort = { version = "=2.0.0-rc.13", default-features = false, features = ["load-dynamic", "cuda", "api-17"] }
tokenizers = "0.23.2"
ureq = { version = "3.4.2", features = ["json"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libloading = "0.9.0"
libc = "0.2"
# Assets, from crates rather than from a PdfCraft checkout: the official Lucide SVG icons
# (ISC) and the Inter / JetBrains Mono variable faces (OFL).
lucide-static-svg = "1.54"
damascene-fonts-inter = "0.1"
damascene-fonts-jetbrains-mono = "0.1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2

